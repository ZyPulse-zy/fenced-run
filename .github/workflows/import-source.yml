name: Import standalone source
on:
  push:
    branches: [bootstrap/import]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify source bundle and commit
        run: |
          base64 -d .bootstrap/source.bundle.b64 > /tmp/source.bundle
          echo 'f9001921ddbc0771dab9c8286c4fc475898057d2c3b15facad7a6dea8dcbfd3f  /tmp/source.bundle' | sha256sum -c -
          git fetch /tmp/source.bundle main:refs/remotes/import/main
          test "$(git rev-parse refs/remotes/import/main)" = 8cea5cd1a05898cd8131b9633af296385b4323fb
          git checkout --detach refs/remotes/import/main
      - run: make test
      - run: make sanitize
      - name: Transfer verified source objects
        continue-on-error: true
        run: git push --force-with-lease=refs/heads/main:1241797e72073b0ff7cd7d7b9397ab2f5f8d71d4 origin HEAD:refs/heads/main
