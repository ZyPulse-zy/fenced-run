name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make sanitize
      - run: sudo modprobe sch_cake && sudo modprobe dummy
      - run: make clean all
      - name: Isolated real-kernel test
        run: sudo env FENCED_RUN_TEST_PARENT_NETNS="$(readlink /proc/self/ns/net)" unshare -n tests/test_network.sh "$PWD/fenced-run" --inside
  musl:
    runs-on: ubuntu-24.04
    container: alpine:3.22
    steps:
      - run: apk add --no-cache build-base python3 git linux-headers
      - uses: actions/checkout@v4
      - run: make test
